# CI：push/PR 时跑 npm test。
# 插件零运行时依赖；@deepseek-ai/dsh-tools 是 peerDependencies（npm 7+ 自动安装），
# 已在 npm registry 公开（0.1.0-rc.6 可用），因此全新 checkout 可直接安装并测试。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      # 发布面回归护栏：files 白名单缺失/拼错会在此失败
      - run: npm pack --dry-run
